version: 2.1

orbs:
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

executors:
  go:
    docker:
      - image: cimg/go:1.26

jobs:
  test:
    executor: go
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-aws-go-{{ checksum "go.sum" }}-
            - setup-aws-go-
      - run: task lint
      - run: task test
      - save_cache:
          key: setup-aws-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

  # Cross-compiles setup-aws into ./dist and persists it to the workspace.
  build:
    executor: go
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-aws-go-{{ checksum "go.sum" }}-
            - setup-aws-go-
      - run: task dry-run
      - persist_to_workspace:
          root: .
          paths:
            - dist

workflows:
  test-publish:
    jobs:
      - test
      - build
      - toolkit/release-pr:
          name: release-pr
          executor: go
          cache-prefix: setup-aws-go
          # One at a time, so two pushes can't race to rewrite release/next.
          serial-group: << pipeline.project.slug >>/release-pr
          requires: &release-requires [test, build]
          context: [github-release]
          filters:
            branches:
              only: main
      - toolkit/publish:
          name: publish
          executor: go
          cache-prefix: setup-aws-go
          serial-group: << pipeline.project.slug >>/publish
          requires: *release-requires
          context: [functions-publisher, github-release]
          filters:
            branches:
              only: main
